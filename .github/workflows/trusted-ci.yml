name: Trusted CI

on:
  push:
    branches: [main, "codex/**", "fix/**", "feat/**", "chore/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trusted-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: ${{ runner.environment == 'github-hosted' }}
      - name: Prepare embedded frontend placeholder
        run: mkdir -p web/dist && touch web/dist/index.html
      - run: go test ./... -count=1 -timeout=20m
      - run: go build -buildvcs=false -o "${RUNNER_TEMP}/new-api" .

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - name: Verify time billing expressions
        run: bun test src/pages/Setting/Ratio/components/requestRuleExpr.test.js
      - run: bun run build
